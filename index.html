<!doctype html>
<html lang="en" class="bfh-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BFH Muse Tarot</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #062522;
      --panel: #0d332f;
      --gold: #d8b66e;
      --cream: #f8ecd5;
      --muted: #b8aa8c;
      font-family: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0%, #16443e 0, var(--bg) 42rem);
      color: var(--cream);
      min-height: 100vh;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 48px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 22px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.05;
      margin: 0 0 18px;
      color: var(--gold);
    }
    .controls, .preview {
      border: 1px solid rgba(216, 182, 110, .35);
      background: rgba(8, 42, 38, .88);
      border-radius: 8px;
      padding: 16px;
    }
    label { display: block; color: var(--muted); font-size: 14px; margin: 14px 0 7px; }
    select, button {
      width: 100%;
      border-radius: 6px;
      border: 1px solid rgba(216, 182, 110, .55);
      background: #09201e;
      color: var(--cream);
      padding: 11px 12px;
      font: inherit;
    }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    button { cursor: pointer; color: #061c1a; background: var(--gold); font-weight: 700; }
    button.secondary { background: transparent; color: var(--gold); }
    .spread { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .spread button[aria-pressed="true"] { background: var(--gold); color: #061c1a; }
    .spread button[aria-pressed="false"] { background: transparent; color: var(--gold); }
    canvas {
      width: min(100%, 420px);
      aspect-ratio: 9 / 16;
      display: block;
      margin: 0 auto;
      border: 1px solid rgba(216, 182, 110, .35);
      background: #062522;
    }
    .grid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 12px;
    }
    .card-tile {
      border: 1px solid rgba(216, 182, 110, .25);
      border-radius: 7px;
      padding: 6px;
      background: rgba(9, 32, 30, .8);
      color: var(--cream);
      min-height: 178px;
      text-align: center;
      font-size: 12px;
      line-height: 1.15;
    }
    .card-tile img { width: 100%; display: block; border-radius: 4px; margin-bottom: 6px; }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
    }

    html.bfh-locked body > main { display: none !important; }
    html.bfh-locked, html.bfh-locked body { overflow: hidden; }
    #bfh-gate {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 12%, #16443e 0, #062522 38rem);
    }
    #bfh-gate-form {
      width: min(100%, 360px); text-align: center;
      border: 1px solid rgba(216, 182, 110, .35);
      background: rgba(8, 42, 38, .92);
      border-radius: 10px; padding: 34px 26px 28px;
    }
    .bfh-gate-mark {
      margin: 0 0 14px; letter-spacing: .38em; text-indent: .38em;
      font-size: 13px; color: var(--gold); opacity: .8;
    }
    #bfh-gate h1 { font-size: 26px; margin: 0 0 10px; color: var(--gold); }
    .bfh-gate-sub { margin: 0 0 20px; font-size: 14px; color: var(--muted); line-height: 1.45; }
    #bfh-gate input {
      width: 100%; border-radius: 6px; padding: 12px;
      border: 1px solid rgba(216, 182, 110, .55);
      background: #09201e; color: var(--cream); font: inherit;
      text-align: center; letter-spacing: .12em;
    }
    #bfh-gate button {
      width: 100%; margin-top: 12px; border-radius: 6px; padding: 12px;
      border: 1px solid rgba(216, 182, 110, .55);
      background: var(--gold); color: #061c1a; font: inherit; font-weight: 700;
      cursor: pointer;
    }
    .bfh-gate-error { margin: 14px 0 0; font-size: 13px; color: #f0b6a4; }
  </style>
</head>
<body>
  <div id="bfh-gate" role="dialog" aria-modal="true" aria-labelledby="bfh-gate-title">
    <form id="bfh-gate-form" autocomplete="off">
      <p class="bfh-gate-mark">BFH</p>
      <h1 id="bfh-gate-title">BFH Muse Tarot</h1>
      <p class="bfh-gate-sub">This deck is private. Enter the passcode to continue.</p>
      <input id="bfh-gate-input" type="password" inputmode="text" autocomplete="off"
             placeholder="Passcode" aria-label="Passcode" spellcheck="false">
      <button type="submit">Enter</button>
      <p class="bfh-gate-error" id="bfh-gate-error" role="alert" hidden>That passcode isn't right. Try again.</p>
    </form>
  </div>
  <script>
  (function () {
    var HASH = "dcedc53848aa73858884c5dd5f496592f68d1d129dfcc9adf4f3ecb3a973c5f6";
    var KEY = "bfh-muse-tarot-unlocked";
    var gate = document.getElementById("bfh-gate");
    var form = document.getElementById("bfh-gate-form");
    var input = document.getElementById("bfh-gate-input");
    var err = document.getElementById("bfh-gate-error");

    function unlock() {
      document.documentElement.classList.remove("bfh-locked");
      gate.remove();
    }
    async function sha256(text) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    }
    try {
      if (localStorage.getItem(KEY) === HASH) { unlock(); return; }
    } catch (e) {}

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var value = input.value.trim();
      var digest = "";
      try { digest = await sha256(value); } catch (e2) { digest = ""; }
      if (digest === HASH) {
        try { localStorage.setItem(KEY, HASH); } catch (e3) {}
        unlock();
      } else {
        err.hidden = false;
        input.value = "";
        input.focus();
      }
    });
    input.focus();
  })();
  </script>

  <main>
    <section class="controls">
      <h1>BFH Muse Tarot</h1>
      <div class="spread">
        <button data-count="1" aria-pressed="true" type="button">1 card</button>
        <button data-count="3" aria-pressed="false" type="button">3 cards</button>
        <button data-count="5" aria-pressed="false" type="button">5 cards</button>
      </div>
      <div id="selectors"></div>
      <div class="buttons">
        <button type="button" id="randomBtn" class="secondary">Random</button>
        <button type="button" id="downloadBtn">Download</button>
      </div>
    </section>
    <section class="preview">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </section>
    <section class="grid" id="grid"></section>
  </main>

  <script>
  const MEANINGS = {

    "03-the-empress": "Fertile ground. Creation, abundance, and the tending that makes things grow.",
    "04-the-emperor": "Structure and solid ground. Authority, order, something built to last.",
    "05-the-hierophant": "Counsel from above. Tradition, the teacher, and the longer view.",
    "06-the-lovers": "A choice made by the heart. Union, the crossroads, and what you truly value.",
    "07-the-chariot": "Forward motion by will. Two forces held in hand and the journey taken on.",
    "08-strength": "Gentle power. The wild thing calmed, courage without force, endurance.",
    "09-the-hermit": "Withdrawal and the inner lamp. Patient searching, wisdom found in quiet.",
    "10-wheel-of-fortune": "The turn. Cycles, changing fortune, a wheel that will not stop for you.",
    "11-justice": "Balance and truth. Cause and effect, the fair weighing, accountability.",
    "12-the-hanged-one": "A willing pause. The view from upside down and the surrender that frees you.",
    "13-death": "An ending that clears the ground. Transformation, the cut that makes room.",
    "14-temperance": "Blending and flow. Healing, right measure, opposites mixed with patience.",
    "15-the-devil": "Binding and desire. The material grip, what holds you, what you allow.",
    "16-the-tower": "A sudden break. The false structure falls and the shock sets you free.",
    "17-the-star": "Hope after the storm. Renewal, calm, and gentle faith restored.",
    "18-the-moon": "Dream and the hidden. Intuition and illusion together on the night path.",
    "19-the-sun": "Clarity and warmth. Plain joy, success seen out in the open.",
    "20-judgement": "The call. Awakening, reckoning and renewal arriving together.",
    "21-the-world": "The circle closed. Completion, wholeness, arrival, the four corners dancing.",

    "ace-of-wands": "The first spark of will. New fire lit, energy offered, something begins.",
    "two-of-wands": "Desire meets its first choice. Two paths weighed before you move.",
    "three-of-wands": "The first return on effort. Growth in the work, the fire answering back.",
    "four-of-wands": "Fire given structure. A steady pause where desire has ground to stand on.",
    "five-of-wands": "Effort meeting resistance. The spark tested by struggle and clash.",
    "six-of-wands": "Fire moving on with relief. Work recognised, harmony restored by action.",
    "seven-of-wands": "The will standing alone. Effort under pressure, holding your position.",
    "eight-of-wands": "Momentum. Swift action and mastery building through steady fire.",
    "nine-of-wands": "Endurance under strain. The fire nearly full, desire close to its limit.",
    "ten-of-wands": "The full load of the work. A cycle closed in heat and labour.",
    "page-of-wands": "Young fire. A message of action, courage taking its first steps.",
    "knight-of-wands": "Fire in pursuit. Drive with speed and appetite, out to meet the world.",
    "queen-of-wands": "Mature fire held within. Creative will tended, warmth that steadies others.",
    "king-of-wands": "Mature fire shown outward. Command of the work, authority that directs.",

    "ace-of-cups": "The first seed of feeling. A cup offered, love and intuition beginning.",
    "two-of-cups": "Two cups meeting. Feeling in balance, a choice made through the heart.",
    "three-of-cups": "Connection bearing fruit. Shared feeling, the heart answered by others.",
    "four-of-cups": "A still pool of feeling. A pause in the heart, connection held and examined.",
    "five-of-cups": "Grief and the spilled cup. What is lost, and what remains once it is mourned.",
    "six-of-cups": "Kindness exchanged. Harmony restored through memory and gentle care.",
    "seven-of-cups": "Many images before the heart. Longing, dream, and the testing of desire.",
    "eight-of-cups": "Feeling on the move. A steady leaving of what no longer answers.",
    "nine-of-cups": "The heart near full. Feeling rich, satisfaction close enough to touch.",
    "ten-of-cups": "Completion in love. The full cup, connection whole, the cycle closed.",
    "page-of-cups": "The young heart. A message of feeling, intuition learning its language.",
    "knight-of-cups": "Feeling in pursuit. Love carried forward to meet the world.",
    "queen-of-cups": "The mature heart. Depth understood, held with care, offered to others.",
    "king-of-cups": "Mature feeling shown outward. Steady authority in love and care.",

    "ace-of-swords": "The first clear thought. A true word offered, the mind begins its cut.",
    "two-of-swords": "Two thoughts in tension. Balance held before the word is spoken.",
    "three-of-swords": "Clarity with a cost. Words that reveal the pain they name.",
    "four-of-swords": "Rest after conflict. Thought held still long enough to settle.",
    "five-of-swords": "Conflict in the mind. A victory that costs more than it gives.",
    "six-of-swords": "The mind moving on. Relief after conflict, clarity toward calmer ground.",
    "seven-of-swords": "Strategy or evasion. Working around a thing rather than through it.",
    "eight-of-swords": "The pattern tightening. Seeing the bind clearly is the way out of it.",
    "nine-of-swords": "Worry at its heaviest. Truth pressing hard in the small hours.",
    "ten-of-swords": "A hard ending. Truth at its limit and the cycle closed.",
    "page-of-swords": "The young mind. A message of truth, words learning their edge.",
    "knight-of-swords": "Thought in pursuit. Decision with speed and force.",
    "queen-of-swords": "Mature thought held within. Clarity that protects its own boundary.",
    "king-of-swords": "Mature thought shown outward. Authority through judgement and clear speech.",

    "ace-of-pentacles": "The first solid seed. Body, money or work offered in usable form.",
    "two-of-pentacles": "Two practical needs juggled. Money, body and work held in motion.",
    "three-of-pentacles": "Work taking form. The first visible result of skill and cooperation.",
    "four-of-pentacles": "A firm hold. Resources protected, the foundation kept in place.",
    "five-of-pentacles": "Strain in the material world. Loss in body, money or home, felt plainly.",
    "six-of-pentacles": "Resources shared. Relief moving between hands, the exchange made fair.",
    "seven-of-pentacles": "The test of patience. Effort reviewed while the results take their time.",
    "eight-of-pentacles": "Steady labour. Mastery building, the world shaped by repetition.",
    "nine-of-pentacles": "Comfort earned. Body, home and money held with quiet strength.",
    "ten-of-pentacles": "Completion in solid form. Home, wealth, inheritance, the cycle closed.",
    "page-of-pentacles": "The young worker. Study and first steps in body, money or craft.",
    "knight-of-pentacles": "Patient progress. Steady pursuit of work, health or money.",
    "queen-of-pentacles": "Mature earth held within. Body and home understood, care made practical.",
    "king-of-pentacles": "Mature earth shown outward. Command of work, money and home."
  };

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const selectorsEl = document.getElementById("selectors");
  const gridEl = document.getElementById("grid");
  const spreadButtons = Array.from(document.querySelectorAll(".spread button"));

  const W = 1080, H = 1920;
  const LAYOUT = {
    1: { cardW: 470, gap: 0,  top: 250, nameSize: 44, textSize: 34 },
    3: { cardW: 306, gap: 24, top: 330, nameSize: 36, textSize: 29 },
    5: { cardW: 186, gap: 14, top: 420, nameSize: 30, textSize: 25 }
  };

  let cards = [];
  let count = 1;
  let picks = [];
  const imageCache = new Map();

  function loadImage(src) {
    if (imageCache.has(src)) return imageCache.get(src);
    const p = new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Could not load " + src));
      img.src = src;
    });
    imageCache.set(src, p);
    return p;
  }

  function buildSelectors() {
    selectorsEl.innerHTML = "";
    for (let i = 0; i < count; i++) {
      const label = document.createElement("label");
      label.setAttribute("for", "card" + i);
      label.textContent = count === 1 ? "Card" : "Card " + (i + 1);
      const select = document.createElement("select");
      select.id = "card" + i;
      cards.forEach((card, idx) => {
        const opt = document.createElement("option");
        opt.value = String(idx);
        opt.textContent = card.name;
        select.appendChild(opt);
      });
      select.value = String(picks[i] != null ? picks[i] : i);
      select.addEventListener("change", () => {
        picks[i] = Number(select.value);
        render();
      });
      selectorsEl.appendChild(label);
      selectorsEl.appendChild(select);
    }
  }

  function setCount(next) {
    count = next;
    spreadButtons.forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.count) === count)));
    picks = picks.slice(0, count);
    while (picks.length < count) {
      let idx = Math.floor(Math.random() * cards.length);
      let guard = 0;
      while (picks.includes(idx) && guard++ < 200) idx = Math.floor(Math.random() * cards.length);
      picks.push(idx);
    }
    buildSelectors();
    render();
  }

  function randomise() {
    const pool = cards.map((_, i) => i);
    picks = [];
    for (let i = 0; i < count; i++) {
      const j = Math.floor(Math.random() * pool.length);
      picks.push(pool.splice(j, 1)[0]);
    }
    buildSelectors();
    render();
  }

  function wrap(text, maxWidth) {
    const words = text.split(/\s+/);
    const lines = [];
    let line = "";
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  async function render() {
    const chosen = picks.slice(0, count).map(i => cards[i]).filter(Boolean);
    if (!chosen.length) return;
    const L = LAYOUT[count];

    const bg = ctx.createRadialGradient(W / 2, 0, 0, W / 2, 0, 1500);
    bg.addColorStop(0, "#16443e");
    bg.addColorStop(1, "#062522");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#d8b66e";
    ctx.font = "44px Georgia, 'Times New Roman', serif";
    ctx.fillText("BFH Muse Tarot", W / 2, 130);

    const cardW = L.cardW;
    const cardH = Math.round(cardW * (1020 / 600));
    const totalW = chosen.length * cardW + (chosen.length - 1) * L.gap;
    const startX = (W - totalW) / 2;

    const images = await Promise.all(chosen.map(c => loadImage(c.file).catch(() => null)));
    images.forEach((img, i) => {
      const cx = startX + i * (cardW + L.gap);
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,.55)";
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 10;
      if (img) {
        ctx.drawImage(img, cx, L.top, cardW, cardH);
      } else {
        ctx.fillStyle = "#0d332f";
        ctx.fillRect(cx, L.top, cardW, cardH);
      }
      ctx.restore();
      ctx.strokeStyle = "rgba(216,182,110,.55)";
      ctx.lineWidth = 3;
      ctx.strokeRect(cx, L.top, cardW, cardH);
    });

    const cardsBottom = L.top + cardH;
    const boxTop = cardsBottom + 60;
    const boxBottom = H - 90;
    const boxX = 70;
    const boxW = W - boxX * 2;

    ctx.fillStyle = "rgba(8,42,38,.88)";
    roundRect(boxX, boxTop, boxW, boxBottom - boxTop, 18);
    ctx.fill();
    ctx.strokeStyle = "rgba(216,182,110,.45)";
    ctx.lineWidth = 2;
    roundRect(boxX, boxTop, boxW, boxBottom - boxTop, 18);
    ctx.stroke();

    const innerW = boxW - 90;
    const blocks = chosen.map(card => {
      ctx.font = L.textSize + "px Georgia, 'Times New Roman', serif";
      return { name: card.name, lines: wrap(MEANINGS[card.slug] || "", innerW) };
    });

    const lineGap = Math.round(L.textSize * 1.35);
    const blockHeights = blocks.map(b => L.nameSize + 14 + b.lines.length * lineGap);
    const totalTextH = blockHeights.reduce((a, b) => a + b, 0);
    const spare = (boxBottom - boxTop) - totalTextH;
    const pad = Math.max(20, spare / (blocks.length + 1));

    let y = boxTop + pad;
    blocks.forEach(block => {
      ctx.textAlign = "center";
      ctx.fillStyle = "#d8b66e";
      ctx.font = L.nameSize + "px Georgia, 'Times New Roman', serif";
      ctx.fillText(block.name, W / 2, y + L.nameSize);
      y += L.nameSize + 14;

      ctx.fillStyle = "#f8ecd5";
      ctx.font = L.textSize + "px Georgia, 'Times New Roman', serif";
      block.lines.forEach(line => {
        ctx.fillText(line, W / 2, y + L.textSize);
        y += lineGap;
      });
      y += pad;
    });
  }

  function buildGrid() {
    gridEl.innerHTML = "";
    cards.forEach(card => {
      const tile = document.createElement("div");
      tile.className = "card-tile";
      const img = document.createElement("img");
      img.src = card.thumb;
      img.alt = card.name;
      img.loading = "lazy";
      tile.appendChild(img);
      tile.appendChild(document.createTextNode(card.name));
      gridEl.appendChild(tile);
    });
  }

  document.getElementById("randomBtn").addEventListener("click", randomise);
  document.getElementById("downloadBtn").addEventListener("click", () => {
    const names = picks.slice(0, count).map(i => cards[i] && cards[i].slug).join("_");
    const link = document.createElement("a");
    link.download = "bfh-muse-tarot_" + names + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
  spreadButtons.forEach(btn => {
    btn.addEventListener("click", () => setCount(Number(btn.dataset.count)));
  });

  fetch("cards.json")
    .then(r => r.json())
    .then(data => {
      cards = data;
      buildGrid();
      setCount(1);
    });
  </script>
</body>
</html>
