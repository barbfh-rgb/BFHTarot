<!doctype html>
<html lang="en" class="bfh-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BFH Muse Tarot</title>
  <meta name="theme-color" content="#0e0720">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --gold: #c9a84c;
      --gold2: #e8c96a;
      --mist: #e8dff5;
      --lav: #c4aae8;
      --cream: #e8dff5;
      --muted: #c4aae8;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    * { box-sizing: border-box; }
    html { font-size: 18px; background: #05030f; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 40% 20%, #1e0a3a 0%, #0e0720 45%, #05030f 100%) fixed;
      color: var(--mist);
      min-height: 100vh;
      line-height: 1.6;
    }
    #sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .s { position: absolute; border-radius: 50%; background: #fff; animation: tw var(--d) ease-in-out infinite var(--dl); }
    @keyframes tw { 0%, 100% { opacity: .08; } 50% { opacity: .9; } }
    main {
      position: relative; z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 48px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 22px;
    }
    h1 {
      font-family: 'Cinzel Decorative', Georgia, serif;
      font-weight: 400;
      font-size: 1.5rem;
      line-height: 1.25;
      letter-spacing: 0.03em;
      margin: 0 0 18px;
      color: var(--gold2);
      text-shadow: 0 0 28px rgba(200, 168, 76, 0.5), 0 0 60px rgba(140, 60, 200, 0.3);
    }
    .controls, .preview {
      border: 1px solid rgba(201, 168, 76, 0.28);
      background: linear-gradient(160deg, rgba(52, 34, 94, 0.55) 0%, rgba(26, 17, 56, 0.65) 100%);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 18px 50px rgba(10, 4, 24, 0.55);
    }
    label {
      display: block; margin: 14px 0 7px;
      font-family: 'Cinzel', serif; font-size: 0.6rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--lav);
    }
    select, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(201, 168, 76, 0.5);
      background: rgba(5, 3, 15, 0.5);
      color: var(--mist);
      padding: 11px 12px;
      font: inherit;
    }
    select { font-size: 1.05rem; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    button {
      cursor: pointer; min-height: 44px;
      font-family: 'Cinzel', serif; font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      border-radius: 24px; border: 1px solid rgba(201, 168, 76, 0.75);
      background: rgba(201, 168, 76, 0.18); color: var(--gold2);
      transition: all 0.25s ease;
    }
    button:hover { background: rgba(201, 168, 76, 0.28); box-shadow: 0 0 14px rgba(201, 168, 76, 0.18); }
    button.secondary { background: rgba(201, 168, 76, 0.05); border-color: rgba(201, 168, 76, 0.35); color: var(--gold2); }
    .spread { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .spread button[aria-pressed="true"] { background: rgba(201, 168, 76, 0.18); border-color: rgba(201, 168, 76, 0.75); color: var(--gold2); }
    .spread button[aria-pressed="false"] { background: rgba(201, 168, 76, 0.05); border-color: rgba(201, 168, 76, 0.35); color: var(--gold2); }
    canvas {
      width: min(100%, 420px);
      aspect-ratio: 9 / 16;
      display: block;
      margin: 0 auto;
      border: 1px solid rgba(201, 168, 76, 0.4);
      border-radius: 10px;
      background: #0e0720;
    }
    .grid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 12px;
    }
    .card-tile {
      border: 1px solid rgba(201, 168, 76, 0.4);
      border-radius: 10px;
      padding: 6px;
      background: linear-gradient(160deg, #34225e 0%, #261a4a 60%, #1a1138 100%);
      color: var(--gold2);
      min-height: 178px;
      text-align: center;
      font-family: 'Cinzel', serif; font-weight: 600;
      font-size: 0.5rem; letter-spacing: 0.08em; text-transform: uppercase;
      line-height: 1.3;
    }
    .card-tile img { width: 100%; display: block; border-radius: 6px; margin-bottom: 6px; }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
    }

    html.bfh-locked body > main { display: none !important; }
    html.bfh-locked, html.bfh-locked body { overflow: hidden; }
    #bfh-gate {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at 40% 20%, #1e0a3a 0%, #0e0720 45%, #05030f 100%);
    }
    #bfh-gate-form {
      width: min(100%, 360px); text-align: center;
      background: linear-gradient(160deg, #382560 0%, #281c4e 60%, #1c133a 100%);
      border: 1px solid var(--gold); border-radius: 18px;
      box-shadow: 0 0 40px rgba(201, 168, 76, .25), 0 18px 50px rgba(0, 0, 0, .55);
      padding: 30px 26px 28px;
    }
    .bfh-gate-mark { display: block; width: 96px; height: 96px; margin: 0 auto 16px; }
    #bfh-gate h1 { font-size: 1.3rem; margin: 0 0 10px; }
    .bfh-gate-sub { margin: 0 0 20px; font-size: 1rem; font-style: italic; color: rgba(228, 220, 245, 0.82); line-height: 1.45; }
    #bfh-gate input {
      width: 100%; border-radius: 10px; padding: 12px;
      border: 1px solid rgba(201, 168, 76, .5);
      background: rgba(5, 3, 15, .5); color: var(--mist);
      font-family: 'Cinzel', serif; font-size: .95rem;
      text-align: center; letter-spacing: .08em; outline: none;
    }
    #bfh-gate input:focus { border-color: var(--gold2); }
    #bfh-gate button {
      width: 100%; margin-top: 12px; border: none; border-radius: 999px; padding: 12px;
      background: linear-gradient(160deg, #e8c96a 0%, #c9a84c 100%); color: #1c133a;
      font-size: .7rem; letter-spacing: .14em;
    }
    .bfh-gate-error { margin: 14px 0 0; font-family: 'Cinzel', serif; font-size: .62rem; letter-spacing: .1em; color: #e6b8d0; }
  </style>
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <div id="bfh-gate" role="dialog" aria-modal="true" aria-labelledby="bfh-gate-title">
    <form id="bfh-gate-form" autocomplete="off">
      <img class="bfh-gate-mark" src="b-logo.png" alt="">
      <h1 id="bfh-gate-title">BFH Muse Tarot</h1>
      <p class="bfh-gate-sub">This deck is private. Enter the passcode to continue.</p>
      <input id="bfh-gate-input" type="password" inputmode="text" autocomplete="off"
             placeholder="Passcode" aria-label="Passcode" spellcheck="false">
      <button type="submit">Enter</button>
      <p class="bfh-gate-error" id="bfh-gate-error" role="alert" hidden>That passcode isn't right. Try again.</p>
    </form>
  </div>
  <script>
  (function () {
    var HASH = "f569ea2b25797478297d4203ce0a8cb719184487195309b82537b3843424ac93";
    var KEY = "bfh-muse-tarot-unlocked";
    var gate = document.getElementById("bfh-gate");
    var form = document.getElementById("bfh-gate-form");
    var input = document.getElementById("bfh-gate-input");
    var err = document.getElementById("bfh-gate-error");

    function unlock() {
      document.documentElement.classList.remove("bfh-locked");
      gate.remove();
    }
    async function sha256(text) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    }
    try {
      if (localStorage.getItem(KEY) === HASH) { unlock(); return; }
    } catch (e) {}

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var value = input.value.trim().toLowerCase();
      var digest = "";
      try { digest = await sha256(value); } catch (e2) { digest = ""; }
      if (digest === HASH) {
        try { localStorage.setItem(KEY, HASH); } catch (e3) {}
        unlock();
      } else {
        err.hidden = false;
        input.value = "";
        input.focus();
      }
    });
    input.focus();
  })();
  </script>

  <main>
    <section class="controls">
      <h1>BFH Muse Tarot</h1>
      <div class="spread">
        <button data-count="1" aria-pressed="true" type="button">1 card</button>
        <button data-count="3" aria-pressed="false" type="button">3 cards</button>
        <button data-count="5" aria-pressed="false" type="button">5 cards</button>
      </div>
      <div id="selectors"></div>
      <div class="buttons">
        <button type="button" id="randomBtn" class="secondary">Random</button>
        <button type="button" id="downloadBtn">Download</button>
      </div>
    </section>
    <section class="preview">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </section>
    <section class="grid" id="grid"></section>
  </main>

  <script>
  const MEANINGS = {

    "king-of-cups": "Mature feeling shown outward. Steady authority in love and care.",

    "ace-of-swords": "The first clear thought. A true word offered, the mind begins its cut.",
    "two-of-swords": "Two thoughts in tension. Balance held before the word is spoken.",
    "three-of-swords": "Clarity with a cost. Words that reveal the pain they name.",
    "four-of-swords": "Rest after conflict. Thought held still long enough to settle.",
    "five-of-swords": "Conflict in the mind. A victory that costs more than it gives.",
    "six-of-swords": "The mind moving on. Relief after conflict, clarity toward calmer ground.",
    "seven-of-swords": "Strategy or evasion. Working around a thing rather than through it.",
    "eight-of-swords": "The pattern tightening. Seeing the bind clearly is the way out of it.",
    "nine-of-swords": "Worry at its heaviest. Truth pressing hard in the small hours.",
    "ten-of-swords": "A hard ending. Truth at its limit and the cycle closed.",
    "page-of-swords": "The young mind. A message of truth, words learning their edge.",
    "knight-of-swords": "Thought in pursuit. Decision with speed and force.",
    "queen-of-swords": "Mature thought held within. Clarity that protects its own boundary.",
    "king-of-swords": "Mature thought shown outward. Authority through judgement and clear speech.",

    "ace-of-pentacles": "The first solid seed. Body, money or work offered in usable form.",
    "two-of-pentacles": "Two practical needs juggled. Money, body and work held in motion.",
    "three-of-pentacles": "Work taking form. The first visible result of skill and cooperation.",
    "four-of-pentacles": "A firm hold. Resources protected, the foundation kept in place.",
    "five-of-pentacles": "Strain in the material world. Loss in body, money or home, felt plainly.",
    "six-of-pentacles": "Resources shared. Relief moving between hands, the exchange made fair.",
    "seven-of-pentacles": "The test of patience. Effort reviewed while the results take their time.",
    "eight-of-pentacles": "Steady labour. Mastery building, the world shaped by repetition.",
    "nine-of-pentacles": "Comfort earned. Body, home and money held with quiet strength.",
    "ten-of-pentacles": "Completion in solid form. Home, wealth, inheritance, the cycle closed.",
    "page-of-pentacles": "The young worker. Study and first steps in body, money or craft.",
    "knight-of-pentacles": "Patient progress. Steady pursuit of work, health or money.",
    "queen-of-pentacles": "Mature earth held within. Body and home understood, care made practical.",
    "king-of-pentacles": "Mature earth shown outward. Command of work, money and home."
  };

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const selectorsEl = document.getElementById("selectors");
  const gridEl = document.getElementById("grid");
  const spreadButtons = Array.from(document.querySelectorAll(".spread button"));

  const W = 1080, H = 1920;
  const LAYOUT = {
    1: { cardW: 470, gap: 0,  top: 250, nameSize: 44, textSize: 34 },
    3: { cardW: 306, gap: 24, top: 330, nameSize: 36, textSize: 29 },
    5: { cardW: 186, gap: 14, top: 420, nameSize: 30, textSize: 25 }
  };

  let cards = [];
  let count = 1;
  let picks = [];
  const imageCache = new Map();

  function loadImage(src) {
    if (imageCache.has(src)) return imageCache.get(src);
    const p = new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Could not load " + src));
      img.src = src;
    });
    imageCache.set(src, p);
    return p;
  }

  function buildSelectors() {
    selectorsEl.innerHTML = "";
    for (let i = 0; i < count; i++) {
      const label = document.createElement("label");
      label.setAttribute("for", "card" + i);
      label.textContent = count === 1 ? "Card" : "Card " + (i + 1);
      const select = document.createElement("select");
      select.id = "card" + i;
      cards.forEach((card, idx) => {
        const opt = document.createElement("option");
        opt.value = String(idx);
        opt.textContent = card.name;
        select.appendChild(opt);
      });
      select.value = String(picks[i] != null ? picks[i] : i);
      select.addEventListener("change", () => {
        picks[i] = Number(select.value);
        render();
      });
      selectorsEl.appendChild(label);
      selectorsEl.appendChild(select);
    }
  }

  function setCount(next) {
    count = next;
    spreadButtons.forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.count) === count)));
    picks = picks.slice(0, count);
    while (picks.length < count) {
      let idx = Math.floor(Math.random() * cards.length);
      let guard = 0;
      while (picks.includes(idx) && guard++ < 200) idx = Math.floor(Math.random() * cards.length);
      picks.push(idx);
    }
    buildSelectors();
    render();
  }

  function randomise() {
    const pool = cards.map((_, i) => i);
    picks = [];
    for (let i = 0; i < count; i++) {
      const j = Math.floor(Math.random() * pool.length);
      picks.push(pool.splice(j, 1)[0]);
    }
    buildSelectors();
    render();
  }

  function wrap(text, maxWidth) {
    const words = text.split(/\s+/);
    const lines = [];
    let line = "";
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const TEXT_FONT = L => "italic " + Math.round(L.textSize * 1.14) + "px 'Cormorant Garamond', Georgia, serif";

  async function render() {
    const chosen = picks.slice(0, count).map(i => cards[i]).filter(Boolean);
    if (!chosen.length) return;
    const L = LAYOUT[count];

    const bg = ctx.createRadialGradient(W * 0.4, H * 0.2, 0, W * 0.4, H * 0.2, 1500);
    bg.addColorStop(0, "#1e0a3a");
    bg.addColorStop(0.45, "#0e0720");
    bg.addColorStop(1, "#05030f");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    let seed = 20261007;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 170; i++) {
      ctx.globalAlpha = 0.25 + rnd() * 0.65;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(rnd() * W, rnd() * H, 0.8 + rnd() * 1.9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center";
    ctx.fillStyle = "#e8c96a";
    ctx.font = "46px 'Cinzel Decorative', Georgia, serif";
    ctx.save();
    ctx.shadowColor = "rgba(200,168,76,.5)";
    ctx.shadowBlur = 28;
    ctx.fillText("BFH Muse Tarot", W / 2, 130);
    ctx.restore();

    const cardW = L.cardW;
    const cardH = Math.round(cardW * (1020 / 600));
    const totalW = chosen.length * cardW + (chosen.length - 1) * L.gap;
    const startX = (W - totalW) / 2;

    const images = await Promise.all(chosen.map(c => loadImage(c.file).catch(() => null)));
    images.forEach((img, i) => {
      const cx = startX + i * (cardW + L.gap);
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,.55)";
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 10;
      if (img) {
        ctx.drawImage(img, cx, L.top, cardW, cardH);
      } else {
        ctx.fillStyle = "#261a4a";
        ctx.fillRect(cx, L.top, cardW, cardH);
      }
      ctx.restore();
      ctx.strokeStyle = "rgba(201,168,76,.6)";
      ctx.lineWidth = 3;
      ctx.strokeRect(cx, L.top, cardW, cardH);
    });

    const cardsBottom = L.top + cardH;
    const boxTop = cardsBottom + 60;
    const boxBottom = H - 90;
    const boxX = 70;
    const boxW = W - boxX * 2;

    const boxFill = ctx.createLinearGradient(boxX, boxTop, boxX + boxW, boxBottom);
    boxFill.addColorStop(0, "rgba(52,34,94,.72)");
    boxFill.addColorStop(1, "rgba(26,17,56,.8)");
    ctx.fillStyle = boxFill;
    roundRect(boxX, boxTop, boxW, boxBottom - boxTop, 18);
    ctx.fill();
    ctx.strokeStyle = "rgba(201,168,76,.45)";
    ctx.lineWidth = 2;
    roundRect(boxX, boxTop, boxW, boxBottom - boxTop, 18);
    ctx.stroke();

    const innerW = boxW - 90;
    const blocks = chosen.map(card => {
      ctx.font = TEXT_FONT(L);
      return { name: card.name, lines: wrap(MEANINGS[card.slug] || "", innerW) };
    });

    const lineGap = Math.round(L.textSize * 1.35);
    const blockHeights = blocks.map(b => L.nameSize + 14 + b.lines.length * lineGap);
    const totalTextH = blockHeights.reduce((a, b) => a + b, 0);
    const spare = (boxBottom - boxTop) - totalTextH;
    const pad = Math.max(20, spare / (blocks.length + 1));

    let y = boxTop + pad;
    blocks.forEach(block => {
      ctx.textAlign = "center";
      ctx.fillStyle = "#e8c96a";
      ctx.font = "600 " + Math.round(L.nameSize * 0.86) + "px 'Cinzel', Georgia, serif";
      ctx.letterSpacing = "3px";
      ctx.fillText(block.name.toUpperCase(), W / 2, y + L.nameSize);
      ctx.letterSpacing = "0px";
      y += L.nameSize + 14;

      ctx.fillStyle = "#e8dff5";
      ctx.font = TEXT_FONT(L);
      block.lines.forEach(line => {
        ctx.fillText(line, W / 2, y + L.textSize);
        y += lineGap;
      });
      y += pad;
    });
  }

  function buildGrid() {
    gridEl.innerHTML = "";
    cards.forEach(card => {
      const tile = document.createElement("div");
      tile.className = "card-tile";
      const img = document.createElement("img");
      img.src = card.thumb;
      img.alt = card.name;
      img.loading = "lazy";
      tile.appendChild(img);
      tile.appendChild(document.createTextNode(card.name));
      gridEl.appendChild(tile);
    });
  }

  (function () {
    const sky = document.getElementById("sky"), f = document.createDocumentFragment();
    for (let i = 0; i < 120; i++) {
      const st = document.createElement("div"), sz = Math.random() * 2 + 0.4;
      st.className = "s";
      st.style.cssText = "width:" + sz + "px;height:" + sz + "px;top:" + Math.random() * 100 + "%;left:" + Math.random() * 100 + "%;--d:" + (Math.random() * 5 + 2) + "s;--dl:" + Math.random() * 7 + "s";
      f.appendChild(st);
    }
    sky.appendChild(f);
  })();
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load("46px 'Cinzel Decorative'"),
      document.fonts.load("600 40px 'Cinzel'"),
      document.fonts.load("italic 40px 'Cormorant Garamond'")
    ]).then(() => render()).catch(() => {});
  }

  document.getElementById("randomBtn").addEventListener("click", randomise);
  document.getElementById("downloadBtn").addEventListener("click", () => {
    const names = picks.slice(0, count).map(i => cards[i] && cards[i].slug).join("_");
    const link = document.createElement("a");
    link.download = "bfh-muse-tarot_" + names + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
  spreadButtons.forEach(btn => {
    btn.addEventListener("click", () => setCount(Number(btn.dataset.count)));
  });

  fetch("cards.json")
    .then(r => r.json())
    .then(data => {
      cards = data;
      buildGrid();
      setCount(1);
    });
  </script>
</body>
</html>
