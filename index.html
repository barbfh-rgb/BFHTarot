<!doctype html>
<html lang="en" class="bfh-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BFH Muse Tarot Reel Chooser</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #062522;
      --panel: #0d332f;
      --gold: #d8b66e;
      --cream: #f8ecd5;
      --muted: #b8aa8c;
      font-family: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0%, #16443e 0, var(--bg) 42rem);
      color: var(--cream);
      min-height: 100vh;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 48px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 22px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.05;
      margin: 0 0 18px;
      color: var(--gold);
      letter-spacing: 0;
    }
    .controls, .preview {
      border: 1px solid rgba(216, 182, 110, .35);
      background: rgba(8, 42, 38, .88);
      border-radius: 8px;
      padding: 16px;
    }
    label { display: block; color: var(--muted); font-size: 14px; margin: 14px 0 7px; }
    select, button {
      width: 100%;
      border-radius: 6px;
      border: 1px solid rgba(216, 182, 110, .55);
      background: #09201e;
      color: var(--cream);
      padding: 11px 12px;
      font: inherit;
    }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    button { cursor: pointer; color: #061c1a; background: var(--gold); font-weight: 700; }
    button.secondary { background: transparent; color: var(--gold); }
    .spread { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .spread button[aria-pressed="true"] { background: var(--gold); color: #061c1a; }
    .spread button[aria-pressed="false"] { background: transparent; color: var(--gold); }
    canvas {
      width: min(100%, 420px);
      aspect-ratio: 9 / 16;
      display: block;
      margin: 0 auto;
      border: 1px solid rgba(216, 182, 110, .35);
      background: #062522;
    }
    .grid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 12px;
    }
    .card-tile {
      border: 1px solid rgba(216, 182, 110, .25);
      border-radius: 7px;
      padding: 6px;
      background: rgba(9, 32, 30, .8);
      color: var(--cream);
      min-height: 178px;
      text-align: center;
      font-size: 12px;
      line-height: 1.15;
    }
    .card-tile img { width: 100%; display: block; border-radius: 4px; margin-bottom: 6px; }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
    }
  
    html.bfh-locked body > main { display: none !important; }
    html.bfh-locked, html.bfh-locked body { overflow: hidden; }
    #bfh-gate {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 12%, #16443e 0, #062522 38rem);
    }
    #bfh-gate-form {
      width: min(100%, 360px); text-align: center;
      border: 1px solid rgba(216, 182, 110, .35);
      background: rgba(8, 42, 38, .92);
      border-radius: 10px; padding: 34px 26px 28px;
    }
    .bfh-gate-mark {
      margin: 0 0 14px; letter-spacing: .38em; text-indent: .38em;
      font-size: 13px; color: var(--gold); opacity: .8;
    }
    #bfh-gate h1 { font-size: 26px; margin: 0 0 10px; color: var(--gold); }
    .bfh-gate-sub { margin: 0 0 20px; font-size: 14px; color: var(--muted); line-height: 1.45; }
    #bfh-gate input {
      width: 100%; border-radius: 6px; padding: 12px;
      border: 1px solid rgba(216, 182, 110, .55);
      background: #09201e; color: var(--cream); font: inherit;
      text-align: center; letter-spacing: .12em;
    }
    #bfh-gate button {
      width: 100%; margin-top: 12px; border-radius: 6px; padding: 12px;
      border: 1px solid rgba(216, 182, 110, .55);
      background: var(--gold); color: #061c1a; font: inherit; font-weight: 700;
      cursor: pointer;
    }
    .bfh-gate-error { margin: 14px 0 0; font-size: 13px; color: #f0b6a4; }
  </style>
</head>
<body>

  <div id="bfh-gate" role="dialog" aria-modal="true" aria-labelledby="bfh-gate-title">
    <form id="bfh-gate-form" autocomplete="off">
      <p class="bfh-gate-mark">BFH</p>
      <h1 id="bfh-gate-title">BFH Muse Tarot</h1>
      <p class="bfh-gate-sub">This deck is private. Enter the passcode to continue.</p>
      <input id="bfh-gate-input" type="password" inputmode="text" autocomplete="off"
             placeholder="Passcode" aria-label="Passcode" spellcheck="false">
      <button type="submit">Enter</button>
      <p class="bfh-gate-error" id="bfh-gate-error" role="alert" hidden>That passcode isn't right. Try again.</p>
    </form>
  </div>
  <script>
  (function () {
    var HASH = "dcedc53848aa73858884c5dd5f496592f68d1d129dfcc9adf4f3ecb3a973c5f6";
    var KEY = "bfh-muse-tarot-unlocked";
    var gate = document.getElementById("bfh-gate");
    var form = document.getElementById("bfh-gate-form");
    var input = document.getElementById("bfh-gate-input");
    var err = document.getElementById("bfh-gate-error");

    function unlock() {
      document.documentElement.classList.remove("bfh-locked");
      gate.remove();
    }
    async function sha256(text) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    }
    try {
      if (localStorage.getItem(KEY) === HASH) { unlock(); return; }
    } catch (e) {}

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var value = input.value.trim();
      var digest = "";
      try {
        digest = await sha256(value);
      } catch (e2) {
        digest = "";
      }
      if (digest === HASH) {
        try { localStorage.setItem(KEY, HASH); } catch (e3) {}
        unlock();
      } else {
        err.hidden = false;
        input.value = "";
        input.focus();
      }
    });
    input.focus();
  })();
  </script>

  <main>
    <section class="controls">
      <h1>BFH Muse Tarot</h1>
      <div class="spread">
        <button id="singleBtn" aria-pressed="true" type="button">1 card</button>
        <button id="doubleBtn" aria-pressed="false" type="button">2 cards</button>
      </div>
      <label for="card1">First card</label>
      <select id="card1"></select>
      <label for="card2" id="card2Label">Second card</label>
      <select id="card2"></select>
      <div class="buttons">
        <button type="button" id="randomBtn" class="secondary">Random</button>
        <button type="button" id="downloadBtn">Download</button>
      </div>
    </section>
    <section class="preview">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </section>
    <section class="grid" id="grid"></section>
  </main>

    const card1 = document.querySelector("#card1");
    const card2 = document.querySelector("#card2");
    const card2Label = document.querySelector("#card2Label");
    const singleBtn = document.querySelector("#singleBtn");
    const doubleBtn = document.querySelector("#doubleBtn");
    const randomBtn = document.querySelector("#randomBtn");
    const downloadBtn = document.querySelector("#downloadBtn");
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");
    let spread = 1;

    function option(card) {
      const opt = document.createElement("option");
      opt.value = card.file;
      opt.textContent = card.name;
      return opt;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function fillSelects() {
      cards.forEach(card => {
        card1.append(option(card));
        card2.append(option(card));
      });
      card2.selectedIndex = 1;
    }

    function setSpread(next) {
      spread = next;
      singleBtn.setAttribute("aria-pressed", String(next === 1));
      doubleBtn.setAttribute("aria-pressed", String(next === 2));
      card2.hidden = next === 1;
      card2Label.hidden = next === 1;
      draw();
    }

    function drawFrame() {
      const grad = ctx.createRadialGradient(540, 120, 20, 540, 900, 1250);
      grad.addColorStop(0, "#16443e");
      grad.addColorStop(1, "#062522");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1920);
      ctx.strokeStyle = "rgba(216,182,110,.62)";
      ctx.lineWidth = 4;
      ctx.strokeRect(54, 54, 972, 1812);
      ctx.strokeStyle = "rgba(216,182,110,.28)";
      ctx.lineWidth = 2;
      ctx.strokeRect(78, 78, 924, 1764);
    }

    function drawCard(img, x, y, w, h) {
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,.55)";
      ctx.shadowBlur = 34;
      ctx.shadowOffsetY = 20;
      ctx.drawImage(img, x, y, w, h);
      ctx.restore();
    }

    async function draw() {
      drawFrame();
      const first = await loadImage(card1.value);
      if (spread === 1) {
        drawCard(first, 200, 310, 680, 1156);
      } else {
        const second = await loadImage(card2.value);
        drawCard(first, 92, 555, 430, 731);
        drawCard(second, 558, 555, 430, 731);
      }
    }

    function randomise() {
      card1.selectedIndex = Math.floor(Math.random() * cards.length);
      card2.selectedIndex = Math.floor(Math.random() * cards.length);
      if (spread === 2 && card1.selectedIndex === card2.selectedIndex) {
        card2.selectedIndex = (card2.selectedIndex + 1) % cards.length;
      }
      draw();
    }

    function download() {
      const names = [card1.options[card1.selectedIndex].textContent];
      if (spread === 2) names.push(card2.options[card2.selectedIndex].textContent);
      const a = document.createElement("a");
      a.download = names.join("-").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") + ".png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    function makeGrid() {
      const grid = document.querySelector("#grid");
      cards.forEach(card => {
        const button = document.createElement("button");
        button.className = "card-tile";
        button.type = "button";
        button.innerHTML = `<img src="${card.thumb}" alt="">${card.name}`;
        button.addEventListener("click", () => {
          card1.value = card.file;
          draw();
          scrollTo({ top: 0, behavior: "smooth" });
        });
        grid.append(button);
      });
    }

    singleBtn.addEventListener("click", () => setSpread(1));
    doubleBtn.addEventListener("click", () => setSpread(2));
    randomBtn.addEventListener("click", randomise);
    downloadBtn.addEventListener("click", download);
    card1.addEventListener("change", draw);
    card2.addEventListener("change", draw);

    fillSelects();
    makeGrid();
    setSpread(1);
  </script>
